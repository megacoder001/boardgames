<!DOCTYPE html>
<html lang='en' data-i18n-title='melody.title'>

<head>
	<title>Melody Game</title>
	<meta charset='utf-8'>
	<link rel='stylesheet' href='melody_game_style.css'>
	<link rel='icon' href='../../images/games_images/melody_images/favicon01.png'>
</head>

<body>
	<script type='module' src='../../common/i18n.js'></script>
	<script type='module' src='main.js'></script>

	<h1><a href='../../menu/main_menu/board_games_main.html' data-i18n='global.exitMainMenu'>Exit to Main Menu</a></h1>
	<h1 id='topic' data-i18n='melody.title'>Melody Game</h1>

	<div id='game-panel'>
		<div id='controls'>
			<button id='new-note' data-i18n='melody.playNote'>Сыграть ноту</button>
			<button id='repeat-note' data-i18n='melody.repeat' disabled>Повторить</button>
		</div>
		<p id='game-status' data-i18n='melody.initialStatus'>Нажми "Сыграть ноту", послушай звук и выбери клавишу.</p>
		<p id='score'></p>
	</div>

	<div id='piano' aria-label='Piano keyboard' data-i18n-aria-label='a11y.pianoKeyboard'>
		<div id='white-keys'>
			<button class='white-key piano-key' data-note='C' data-i18n='note.C' type='button'>До</button>
			<button class='white-key piano-key' data-note='D' data-i18n='note.D' type='button'>Ре</button>
			<button class='white-key piano-key' data-note='E' data-i18n='note.E' type='button'>Ми</button>
			<button class='white-key piano-key' data-note='F' data-i18n='note.F' type='button'>Фа</button>
			<button class='white-key piano-key' data-note='G' data-i18n='note.G' type='button'>Соль</button>
			<button class='white-key piano-key' data-note='A' data-i18n='note.A' type='button'>Ля</button>
			<button class='white-key piano-key' data-note='B' data-i18n='note.B' type='button'>Си</button>
		</div>
		<div id='black-keys'>
			<button class='black-key piano-key black-key-c-sharp' data-note='C#' data-i18n='note.C#' type='button'>До#</button>
			<button class='black-key piano-key black-key-d-sharp' data-note='D#' data-i18n='note.D#' type='button'>Ре#</button>
			<button class='black-key piano-key black-key-f-sharp' data-note='F#' data-i18n='note.F#' type='button'>Фа#</button>
			<button class='black-key piano-key black-key-g-sharp' data-note='G#' data-i18n='note.G#' type='button'>Соль#</button>
			<button class='black-key piano-key black-key-a-sharp' data-note='A#' data-i18n='note.A#' type='button'>Ля#</button>
		</div>
	</div>

	<footer>
	</footer>
</body>

</html>
